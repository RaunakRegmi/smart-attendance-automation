# Backend development environment (API + PostgreSQL + Redis)
# Start: docker compose up --build
# Run the admin panel locally: cd admin && npm start  →  http://localhost:4200
# Data persists across restarts via named volumes (postgres_data, uploads, exports).
# Backend code hot-reloads via bind mount on ./backend.

services:
  db:
    image: postgres:15-alpine
    container_name: attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-attendance_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PUBLISH_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-attendance_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - attendance_network

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - attendance_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      PORT: 5000
      PUBLIC_URL: http://localhost:${BACKEND_PUBLISH_PORT:-5001}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-attendance_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 5000000
      ALLOWED_EXTENSIONS: xlsx,xls
      # Use migrations in Docker; avoid sequelize.sync altering schema on every boot
      DB_SYNC_ALTER: "false"
      # Chatbot runs on the host; backend in Docker reaches it via host.docker.internal
      CHATBOT_URL: ${CHATBOT_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PUBLISH_PORT:-5001}:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Bind mount: local code changes apply immediately; nodemon restarts the API
      - ./backend:/app
      # Anonymous volume: keep container node_modules separate from host
      - backend_node_modules:/app/node_modules
      # Named volumes: uploaded files and exports survive container recreation
      - backend_uploads:/app/uploads
      - backend_exports:/app/exports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - attendance_network

volumes:
  postgres_data:
    name: attendance_postgres_data
  redis_data:
    name: attendance_redis_data
  backend_node_modules:
    name: attendance_backend_node_modules
  backend_uploads:
    name: attendance_backend_uploads
  backend_exports:
    name: attendance_backend_exports

networks:
  attendance_network:
    driver: bridge
