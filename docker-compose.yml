services:
  db:
    image: postgres:15-alpine
    container_name: attendance_db
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance_network

  app:
    build: .
    container_name: attendance_app
    environment:
      NODE_ENV: development
      PORT: 5000
      PUBLIC_URL: http://localhost:5001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: attendance_db
      DB_USER: postgres
      DB_PASSWORD: admin
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 5000000
      ALLOWED_EXTENSIONS: xlsx,xls
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    networks:
      - attendance_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  attendance_network:
    driver: bridge
